name: Deploy to GitHub Pages

on:
  # Run on every push to main
  push:
    branches: [main]
  # Weekly rebuild (Mondays 06:00 UTC) so the static /roles SEO snapshot
  # refreshes from the backend even without a push. This is a fallback net,
  # not the primary mechanism — see repository_dispatch below.
  schedule:
    - cron: '0 6 * * 1'
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Event-driven rebuild: the ATS backend fires this the moment a role is
  # published/edited/closed, so a new /roles/{slug} detail page (prerendered
  # via getStaticPaths in src/pages/roles/[slug].astro) goes live within a
  # couple minutes instead of waiting for the next push or the weekly cron.
  # Backend calls, e.g.:
  #   curl -X POST -H "Authorization: Bearer $GH_TOKEN" \
  #     -H "Accept: application/vnd.github+json" \
  #     https://api.github.com/repos/purrfecthire-org/web-v2/dispatches \
  #     -d '{"event_type":"role-published"}'
  # $GH_TOKEN needs a fine-grained PAT scoped to this repo with
  # "Actions: write" permission (not the default GITHUB_TOKEN, which can't
  # trigger repository_dispatch and can't be used cross-repo).
  repository_dispatch:
    types: [role-published]

# Permissions the GITHUB_TOKEN needs to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel an in-progress one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        # PUBLIC_API_ENDPOINT drives the /roles list + detail build-time fetch
        # (and its client-side refresh) plus the apply forms. Without it set as
        # a repo Actions variable, these all fall back to their empty/offline
        # states and every production build silently ships with no roles.
        # Settings → Secrets and variables → Actions → Variables →
        # PUBLIC_API_ENDPOINT = https://ats-backend-snowy.vercel.app
        env:
          PUBLIC_API_ENDPOINT: ${{ vars.PUBLIC_API_ENDPOINT }}
          PUBLIC_LOG_ENDPOINT: ${{ vars.PUBLIC_LOG_ENDPOINT }}
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
